{% extends "base.html" %}
{% block body %}
    <main class="container py-5 text-center">
        <h1 class="mb-4">Add a Star</h1>
        <form method="POST" action="{{ url_for('add_star') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="real_name" class="form-label">Real Name</label>
                <input type="text" class="form-control" id="real_name" name="real_name" required>
            </div>
            <div class="mb-3">
                <label for="place_of_birth" class="form-label">Place of Birth</label>
                <input type="text" class="form-control" id="place_of_birth" name="place_of_birth" required>
            </div>
            <div class="mb-3">
                <label for="image_url" class="form-label">Image URL</label>
                <input type="text" class="form-control" id="image_url" name="image_url" required>
            </div>
            <div class="mb-3">
                <label for="birthdate" class="form-label">Birthdate</label>
                <input type="date" class="form-control" id="birthdate" name="birthdate" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Star</button>
        </form>
    </main>
{% endblock %}
