{% extends "base.html" %}
{% block body %}
    <main class="container py-5">
        <h1 class="mb-4">Edit Movie</h1>
        <form method="POST" action="{{ url_for('edit_movie', movie_id=movie.id) }}">
            <div class="mb-3">
                <label for="movie_title" class="form-label">Title</label>
                <input type="text" class="form-control" id="movie_title" name="movie_title" value="{{ movie.movie_title }}" required>
            </div>
            <div class="mb-3">
                <label for="release_date" class="form-label">Release date</label>
                <input type="date" class="form-control" id="release_date" name="release_date" value="{{ movie.release_date or '' }}">
            </div>
            <div class="mb-3">
                <label for="poster_url" class="form-label">Poster URL</label>
                <input type="url" class="form-control" id="poster_url" name="poster_url" value="{{ movie.poster_url or '' }}">
            </div>
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-secondary" href="{{ url_for('movies') }}">Cancel</a>
        </form>
    </main>
{% endblock %}
